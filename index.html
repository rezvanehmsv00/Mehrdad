<script>window.LL_PLANS = {"tennis":{"format":1,"rev":1,"plan":"tennis","title":"Strength with tennis skills","version":{"date":"2026-09-30","note":"Band exercises added, weights follow your 1/3/5/8 kg dumbbells, tennis plan added","noteDe":"Band-Übungen, Gewichte nach deinen 1/3/5/8-kg-Hanteln, Tennis-Plan"},"cycles":{"1":{"name":"Foundation","focus":"Learn the moves, slow and controlled","rest":45},"2":{"name":"Build","focus":"A third set and a little more weight","rest":60},"3":{"name":"Strength","focus":"Heavier main lifts, side-to-side tennis work","rest":75},"4":{"name":"Court-ready","focus":"Stronger single-leg work, quick feet and rotation for tennis","rest":75}},"nextTip":{"1":"Next up, cycle 2 (Build): a third set and slightly heavier weights. Keep every rep pain-free.","2":"Next up, cycle 3 (Strength): heavier main lifts, and lateral lunges and skater steps as your tennis skill work.","3":"Next up, cycle 4 (Court-ready): split squats, quicker skater steps and more rotation. Quality over speed.","4":"Next up: round 2 from cycle 1 with today's weights. It will feel easier; that's progress."},"days":{"1":{"lower":[{"group":"Skill","slot":"S1","name":"Lateral band walk","perSide":true,"cue":"Short band above the knees, slight squat, small steps sideways. Strong hips protect the knee and power your side-to-side footwork.","weeks":[[2,10],[2,12],[2,10,"slower lowering"],[1,10,"light week"]]},{"group":"Skill","slot":"S2","name":"Single-leg balance","time":true,"perSide":true,"cue":"Stand on one leg, knee soft, eyes forward. Hold a wall at first. Balance is the base of every shot.","weeks":[[2,20],[2,25],[2,20,"slower lowering"],[1,20,"light week"]]},{"group":"Main","slot":"1a","name":"Box squat to chair","weighted":true,"cue":"Hold a dumbbell at your chest, sit back to a chair, stand up. The chair controls the depth, which is kind to the knee.","weeks":[[2,10],[2,12],[3,10,"+1 set, heavier"],[1,10,"light week"]]},{"group":"Main","slot":"1b","name":"Glute bridge","weighted":true,"cue":"Push through your heels, squeeze at the top.","weeks":[[2,12],[2,14],[2,12,"heavier"],[1,12,"light week"]]},{"group":"Main","slot":"2a","name":"Romanian deadlift","weighted":true,"cue":"Hips back, flat back, dumbbells close to your legs.","weeks":[[2,10],[2,12],[3,10,"+1 set, heavier"],[1,10,"light week"]]},{"group":"Main","slot":"2b","name":"Standing calf raise","weighted":true,"cue":"Rise onto your toes, lower slowly.","weeks":[[2,12],[2,14],[2,12,"heavier"],[1,12,"light week"]]},{"group":"Core","slot":"C1","name":"Dead bug","perSide":true,"cue":"Lower back pressed down, move slowly.","weeks":[[2,6],[2,8],[2,6,"slower lowering"],[1,6,"light week"]]}],"upper":[{"group":"Skill","slot":"S1","name":"Side-lying external rotation","weighted":true,"perSide":true,"cue":"The 1 kg dumbbell. Elbow on your side, rotate the forearm up. The classic rotator-cuff exercise for tennis players.","weeks":[[2,12],[2,14],[2,12,"heavier"],[1,12,"light week"]]},{"group":"Skill","slot":"S2","name":"Standing woodchop","weighted":true,"perSide":true,"cue":"One dumbbell in both hands, rotate from high to low across your body, like a slow, controlled forehand.","weeks":[[2,8],[2,10],[2,8,"heavier"],[1,8,"light week"]]},{"group":"Main","slot":"1a","name":"Incline push-up","cue":"Hands on a sturdy table edge. Grip the edge so your wrists stay straight. Stop if the wrist hurts.","weeks":[[2,8],[2,10],[3,8,"+1 set, slower lowering"],[1,8,"light week"]]},{"group":"Main","slot":"1b","name":"Single-arm row","weighted":true,"perSide":true,"cue":"Palm facing in, pull the elbow to your hip.","weeks":[[2,10],[2,12],[2,10,"heavier"],[1,10,"light week"]]},{"group":"Main","slot":"2a","name":"Neutral-grip shoulder press","weighted":true,"cue":"Palms face each other: easier on wrists and shoulders.","weeks":[[2,10],[2,12],[3,10,"+1 set, heavier"],[1,10,"light week"]]},{"group":"Main","slot":"2b","name":"Band pull-apart","cue":"Long band at shoulder height, arms straight, pull it apart. Good posture and healthy shoulders.","weeks":[[2,15],[2,17],[2,15,"slower lowering"],[1,15,"light week"]]},{"group":"Core","slot":"C1","name":"Forearm plank","time":true,"cue":"On forearms, fists relaxed, body in one line.","weeks":[[2,20],[2,25],[2,20,"slower lowering"],[1,20,"light week"]]}]},"2":{"lower":[{"group":"Skill","slot":"S1","name":"Lateral band walk","perSide":true,"cue":"Band a bit lower (around the knees or ankles) for more challenge.","weeks":[[3,12],[3,14],[3,12,"slower lowering"],[2,12,"light week"]]},{"group":"Skill","slot":"S2","name":"Skater step","perSide":true,"cue":"Step (don't jump) wide to the side onto one leg, hold 1 s, step back. Like reaching a wide ball.","weeks":[[2,6],[2,8],[2,6,"slower lowering"],[1,6,"light week"]]},{"group":"Main","slot":"1a","name":"Goblet squat","weighted":true,"cue":"Squat to a comfortable depth. Put a chair behind you if the knee complains.","weeks":[[3,10],[3,12],[4,10,"+1 set, heavier"],[2,10,"light week"]]},{"group":"Main","slot":"1b","name":"Romanian deadlift","weighted":true,"cue":"A bit heavier than cycle 1.","weeks":[[3,10],[3,12],[3,10,"heavier"],[2,10,"light week"]]},{"group":"Main","slot":"2a","name":"Low step-up","weighted":true,"perSide":true,"cue":"Onto a stair. Push through the whole foot; knee tracks over the toes.","weeks":[[3,8],[3,10],[4,8,"+1 set, heavier"],[2,8,"light week"]]},{"group":"Main","slot":"2b","name":"Single-leg calf raise","weighted":true,"perSide":true,"cue":"Hold a wall. Tennis is played on the balls of your feet.","weeks":[[3,10],[3,12],[3,10,"heavier"],[2,10,"light week"]]},{"group":"Core","slot":"C1","name":"Dead bug with dumbbell","perSide":true,"cue":"Hold the dumbbell over your chest, back flat.","weeks":[[2,8],[2,10],[2,8,"slower lowering"],[1,8,"light week"]]}],"upper":[{"group":"Skill","slot":"S1","name":"Band external rotation","cue":"Long band in both hands, elbows glued to your sides, rotate the forearms outward. Protects the shoulder for serves.","weeks":[[3,15],[3,17],[3,15,"slower lowering"],[2,15,"light week"]]},{"group":"Skill","slot":"S2","name":"Pallof press","perSide":true,"cue":"Long band around a table leg or door handle at chest height. Stand side-on, press the band straight out and resist the twist. The core control behind every groundstroke.","weeks":[[2,10],[2,12],[2,10,"slower lowering"],[1,10,"light week"]]},{"group":"Main","slot":"1a","name":"Incline push-up","cue":"Use a lower surface than in cycle 1. Grip the edge to keep wrists straight.","weeks":[[3,10],[3,12],[4,10,"+1 set, slower lowering"],[2,10,"light week"]]},{"group":"Main","slot":"1b","name":"Bent-over row","weighted":true,"cue":"Both dumbbells, palms facing each other, flat back.","weeks":[[3,10],[3,12],[3,10,"heavier"],[2,10,"light week"]]},{"group":"Main","slot":"2a","name":"Neutral-grip shoulder press","weighted":true,"cue":"Palms face each other, ribs down.","weeks":[[3,10],[3,12],[4,10,"+1 set, heavier"],[2,10,"light week"]]},{"group":"Main","slot":"2b","name":"Rear delt fly","weighted":true,"cue":"Light, flat back. Keeps shoulders balanced.","weeks":[[3,12],[3,14],[3,12,"heavier"],[2,12,"light week"]]},{"group":"Core","slot":"C1","name":"Forearm plank","time":true,"cue":"Squeeze glutes, breathe.","weeks":[[2,30],[2,35],[2,30,"slower lowering"],[1,30,"light week"]]}]},"3":{"lower":[{"group":"Skill","slot":"S1","name":"Lateral lunge","perSide":true,"cue":"Small step to the side, sit into that hip, push back. Only as deep as the knee is comfortable. Trains side-to-side movement.","weeks":[[3,6],[3,8],[3,6,"slower lowering"],[2,6,"light week"]]},{"group":"Skill","slot":"S2","name":"Skater step","perSide":true,"cue":"A little quicker than cycle 2, still stepping, not jumping.","weeks":[[3,8],[3,10],[3,8,"slower lowering"],[2,8,"light week"]]},{"group":"Main","slot":"1a","name":"Goblet squat, 3 s lowering","weighted":true,"cue":"Count 3 on the way down, stand up normally.","weeks":[[3,8],[3,10],[4,8,"+1 set, heavier"],[2,8,"light week"]]},{"group":"Main","slot":"1b","name":"Single-leg RDL","weighted":true,"perSide":true,"cue":"Hold a wall with the free hand.","weeks":[[3,8],[3,10],[3,8,"heavier"],[2,8,"light week"]]},{"group":"Main","slot":"2a","name":"Hip thrust","weighted":true,"cue":"Shoulders on the sofa, dumbbell on hips, short band above the knees.","weeks":[[3,12],[3,14],[4,12,"+1 set, heavier"],[2,12,"light week"]]},{"group":"Main","slot":"2b","name":"Single-leg calf raise","weighted":true,"perSide":true,"cue":"Slow lowering.","weeks":[[3,12],[3,14],[3,12,"heavier"],[2,12,"light week"]]},{"group":"Core","slot":"C1","name":"Side plank","time":true,"perSide":true,"cue":"On your forearm, hips high.","weeks":[[2,30],[2,35],[2,30,"slower lowering"],[1,30,"light week"]]}],"upper":[{"group":"Skill","slot":"S1","name":"Band external rotation","cue":"Thicker band or hands closer together, 2 s pause out wide.","weeks":[[3,15],[3,17],[3,15,"slower lowering"],[2,15,"light week"]]},{"group":"Skill","slot":"S2","name":"Standing woodchop","weighted":true,"perSide":true,"cue":"A little faster, still controlled, rotate from the hips.","weeks":[[3,10],[3,12],[3,10,"heavier"],[2,10,"light week"]]},{"group":"Main","slot":"1a","name":"Push-up on dumbbells","cue":"Hands on dumbbell handles on the floor so wrists stay straight. Knees down if needed.","weeks":[[3,8],[3,10],[4,8,"+1 set, slower lowering"],[2,8,"light week"]]},{"group":"Main","slot":"1b","name":"Bent-over row","weighted":true,"cue":"Heavier than cycle 2.","weeks":[[3,10],[3,12],[3,10,"heavier"],[2,10,"light week"]]},{"group":"Main","slot":"2a","name":"Single-arm shoulder press","weighted":true,"perSide":true,"cue":"Standing, palm facing in. Don't lean away from the weight.","weeks":[[3,8],[3,10],[4,8,"+1 set, heavier"],[2,8,"light week"]]},{"group":"Main","slot":"2b","name":"Band pull-apart","cue":"Thicker band, 2 s squeeze.","weeks":[[3,15],[3,17],[3,15,"slower lowering"],[2,15,"light week"]]},{"group":"Core","slot":"C1","name":"Suitcase carry","weighted":true,"time":true,"perSide":true,"cue":"Walk tall with the 8 kg dumbbell in one hand; don't lean. Builds grip and core.","weeks":[[2,30],[2,35],[2,30,"heavier"],[1,30,"light week"]]}]},"4":{"lower":[{"group":"Skill","slot":"S1","name":"Skater step","perSide":true,"cue":"Quick and light, land soft and balanced. Like moving for wide balls.","weeks":[[3,10],[3,12],[3,10,"slower lowering"],[2,10,"light week"]]},{"group":"Skill","slot":"S2","name":"Lateral band walk","perSide":true,"cue":"Band around the ankles, stay low.","weeks":[[3,12],[3,14],[3,12,"slower lowering"],[2,12,"light week"]]},{"group":"Main","slot":"1a","name":"Split squat","weighted":true,"perSide":true,"cue":"Short range and pain-free only. The back knee lowers toward the floor.","weeks":[[3,8],[3,10],[4,8,"+1 set, heavier"],[2,8,"light week"]]},{"group":"Main","slot":"1b","name":"Single-leg RDL","weighted":true,"perSide":true,"cue":"Heavier than cycle 3.","weeks":[[3,8],[3,10],[3,8,"heavier"],[2,8,"light week"]]},{"group":"Main","slot":"2a","name":"Hip thrust, 3 s hold","weighted":true,"cue":"Hold 3 s at the top of every rep.","weeks":[[3,10],[3,12],[4,10,"+1 set, heavier"],[2,10,"light week"]]},{"group":"Main","slot":"2b","name":"Single-leg calf raise","weighted":true,"perSide":true,"cue":"Pause at the top.","weeks":[[3,15],[3,17],[3,15,"heavier"],[2,15,"light week"]]},{"group":"Core","slot":"C1","name":"Side plank reach-through","perSide":true,"cue":"On your forearm; thread the top arm under and reach up.","weeks":[[2,8],[2,10],[2,8,"slower lowering"],[1,8,"light week"]]}],"upper":[{"group":"Skill","slot":"S1","name":"Band external rotation","cue":"Slow, 2 s pause out wide.","weeks":[[3,15],[3,17],[3,15,"slower lowering"],[2,15,"light week"]]},{"group":"Skill","slot":"S2","name":"Standing woodchop","weighted":true,"perSide":true,"cue":"Powerful but controlled, like a forehand.","weeks":[[3,12],[3,14],[3,12,"heavier"],[2,12,"light week"]]},{"group":"Main","slot":"1a","name":"Push-up on dumbbells, 3 s lowering","cue":"Hands on dumbbell handles, 3 s down.","weeks":[[3,8],[3,10],[4,8,"+1 set, slower lowering"],[2,8,"light week"]]},{"group":"Main","slot":"1b","name":"Single-arm row","weighted":true,"perSide":true,"cue":"Heavier than cycle 1, palm in.","weeks":[[3,10],[3,12],[3,10,"heavier"],[2,10,"light week"]]},{"group":"Main","slot":"2a","name":"Single-arm shoulder press","weighted":true,"perSide":true,"cue":"Standing, core tight.","weeks":[[3,8],[3,10],[4,8,"+1 set, heavier"],[2,8,"light week"]]},{"group":"Main","slot":"2b","name":"Dumbbell pullover","weighted":true,"cue":"One dumbbell held by the end in both hands, lying on the floor. Feel the lats stretch.","weeks":[[3,12],[3,14],[3,12,"heavier"],[2,12,"light week"]]},{"group":"Core","slot":"C1","name":"Forearm plank with leg lift","perSide":true,"cue":"Lift one foot at a time, hips still.","weeks":[[2,8],[2,10],[2,8,"slower lowering"],[1,8,"light week"]]}]}}}};</script>

</head><body><title>Lunchtime Lifts</title>
<style>
/* Layout: one calm column (max 520px). Home screens get a bottom tab bar; the workout gets a fixed action dock in thumb reach. */
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("fonts/figtree-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("fonts/figtree-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("fonts/figtree-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("fonts/figtree-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --bg: #F3F4F0;
  --surface: #FFFFFF;
  --sunken: #E8EAE4;
  --ink: #16191A;
  --muted: #5B635E;
  --line: #D8DBD3;
  --accent: #2F4BD1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E7FC;
  --good: #20794B;
  --good-ink: #FFFFFF;
  --good-soft: #DCEFE3;
  --warn: #8A4F07;
  --warn-soft: #FAEBD2;
  --danger: #B3261E;
  --danger-soft: #FBE3E1;
  --lower: #2C8C58;
  --upper: #17603B;
  --day-ink: #FFFFFF;
  --yoga: #CBE9D6;
  --yoga-ink: #1D6B42;
  --rest: #DADDD6;
  --tennis: #E4EE9A;
  --tennis-ink: #4B5A00;
  --shadow: 0 1px 2px rgba(22, 25, 26, .06), 0 4px 16px rgba(22, 25, 26, .06);
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111413; --surface: #1A1E1C; --sunken: #252A27; --ink: #EDEFEA; --muted: #A2AAA5; --line: #313733;
    --accent: #93A6FF; --accent-ink: #0D1331; --accent-soft: #232B4D;
    --good: #72D09A; --good-ink: #0B2015; --good-soft: #1B3326;
    --warn: #EFB76A; --warn-soft: #3A2A13; --danger: #FF8A80; --danger-soft: #3D1D1B;
    --lower: #5CC68C; --upper: #2F9E63; --day-ink: #07170E; --yoga: #1F3A2A; --yoga-ink: #8FDDB0; --rest: #2C312E; --tennis: #3B4214; --tennis-ink: #D9E77A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --lower: #5CC68C; --upper: #2F9E63; --day-ink: #07170E; --yoga: #1F3A2A; --yoga-ink: #8FDDB0; --rest: #2C312E; --tennis: #3B4214; --tennis-ink: #D9E77A;
  --bg: #111413; --surface: #1A1E1C; --sunken: #252A27; --ink: #EDEFEA; --muted: #A2AAA5; --line: #313733;
  --accent: #93A6FF; --accent-ink: #0D1331; --accent-soft: #232B4D;
  --good: #72D09A; --good-ink: #0B2015; --good-soft: #1B3326;
  --warn: #EFB76A; --warn-soft: #3A2A13; --danger: #FF8A80; --danger-soft: #3D1D1B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; padding-inline: 16px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 520px; margin: 0 auto; padding-block: 12px calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
.app.in-workout { padding-bottom: calc(var(--dock-h, 190px) + 16px); }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 22px; line-height: 1.15; }
h3 { font-size: 18px; line-height: 1.2; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.sub { color: var(--muted); font-size: 15px; font-weight: 600; }

/* buttons: every tap target is at least 48px tall */
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary.big { min-height: 58px; font-size: 18px; border-radius: 16px; width: 100%; }
.btn-soft { background: var(--sunken); color: var(--ink); }
.btn-ghost { color: var(--accent); padding: 0 8px; }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }

/* home header + bottom tab bar */
.apphead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.wordmark svg { width: 26px; height: 26px; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tabbar button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* fixed action dock (Start workout, Done, rest controls) */
.dock { position: fixed; left: 0; right: 0; z-index: 14; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); padding: 16px 16px 12px; background: linear-gradient(to bottom, transparent, var(--bg) 24%); }
.dock.no-tabs { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.dock .inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

#view { display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.banner { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.banner.good { background: var(--good-soft); }
.banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* today */
.greet { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.greet h1 { font-size: 44px; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.plist li.g { border-top: 0; padding: 18px 0 4px; font-weight: 700; font-size: 14px; color: var(--muted); }
.plist li.g:first-child { padding-top: 2px; }
.plist .t { color: var(--muted); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.weekbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.weekbar div { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.weekbar i { display: block; height: 8px; border-radius: 4px; background: var(--sunken); }
.weekbar .done i { background: var(--good); }
.weekbar .next i { background: var(--accent); }
.weekbar .next { color: var(--ink); }
.dots { display: flex; gap: 6px; }
.dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
.dot span { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 700; font-size: 15px; }
.dot.on span { background: var(--good); border-color: var(--good); color: var(--good-ink); }

/* workout header */
.whead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
.whead .row { justify-content: space-between; }

function itemsFor(cycle, week, day) {
  const hasBar = !!(S.state.prefs && S.state.prefs.bar);
  const round = S.state.round || 1;
  const useB = allSessions().filter(s => s.done && s.day === day && s.cycle === cycle && roundOf(s) === round).length % 2 === 1;
  return PLAN[cycle][day].filter(e => hasBar ? !e.nobar : !e.bar).map(e => (useB && e.alt) || e).map(e => {
    const [sets, reps, note] = e.weeks[week - 1];
    // tempo: the exercise's own, else the cycle's for main lifts; never when the name or week note already says it
    let tempo = typeof e.tempo === 'string' ? e.tempo : (e.group === 'Main' && !e.time && CYCLE_INFO[cycle] && CYCLE_INFO[cycle].tempo) || '';

function renderSummary() {

    if (prev && now > prev) bests.push(`${it.name}: ${fmtW(+top.w, nOf(top, it.id))}`);
  }
  view.innerHTML = `
  <section class="greet"><h3>Workout saved</h3><h1>Nice work.</h1><p class="muted">${DAY_LABEL[s.day]}, cycle ${s.cycle}, week ${s.week}</p></section>

/* ---------- days: workouts, yoga, rest ---------- */
const todayKey = () => dayKey(new Date());
function workoutTypesOn(key) {
  return [...new Set(allSessions().filter(s => s.done && dayKey(new Date(s.startedAt)) === key).map(s => s.day))];
}
function dayStatus(key) { // 'lower' | 'upper' | 'both' | 'yoga' | 'rest' | null
  const t = workoutTypesOn(key);
  if (t.length) return t.length > 1 ? 'both' : t[0];
  return (S.state.days || {})[key] || null;
}
const isWorkout = st => st === 'lower' || st === 'upper' || st === 'both';
const isActiveDay = st => isWorkout(st) || (ACTIVE.alt.counts && st === ACTIVE.alt.key);
function restDueToday() {
  const d = new Date();
  for (let i = 1; i <= 2; i++) if (!isActiveDay(dayStatus(dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - i))))) return false;
  return true;
}
function setDay(key, type) {
  S.state.days = { ...(S.state.days || {}) };
  if (type) S.state.days[key] = type; else delete S.state.days[key];
  saveState();
}
const STATUS_LABEL = { lower: ACTIVE.days.lower.short, upper: ACTIVE.days.upper.short, both: 'Both', yoga: 'Yoga', tennis: 'Tennis', rest: 'Rest' };
const STATUS_SHORT = lang() === 'de' ? { lower: 'U', upper: 'O', both: 'U+O', yoga: 'Y', tennis: 'T', rest: 'R' } : { lower: ACTIVE.days.lower.short[0], upper: ACTIVE.days.upper.short[0], both: 'Both', yoga: 'Y', tennis: 'T', rest: 'R' };
function weekStart(offset = 0) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7); return d; }
function dayCell(date, big) {
  const key = dayKey(date), st = dayStatus(key);
  const isToday = key === todayKey(), future = date > new Date() && !isToday;
  const label = st ? STATUS_LABEL[st] : future ? '' : isToday ? 'Today' : '';
  const name = date.toLocaleDateString(LOC(), { weekday: 'long', day: 'numeric', month: 'long' });
  return `<button class="dc ${st || ''} ${isToday ? 'today' : ''} ${future ? 'future' : ''}" ${future || isWorkout(st) ? 'disabled' : `data-act="day-edit" data-v="${key}"`} aria-label="${name}: ${st ? STATUS_LABEL[st] : future ? 'upcoming' : 'nothing logged'}">
    <span class="dn">${date.getDate()}</span>${st ? `<span class="dl">${big ? STATUS_LABEL[st] : STATUS_SHORT[st]}</span>` : ''}</button>`;
}
function weekStripHTML(offset = 0) {
  const s0 = weekStart(offset);
  const days = [...Array(7)].map((_, i) => new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + i));
  return `<div class="cal week">${days.map(d => `<div class="wd">${d.toLocaleDateString(LOC(), { weekday: 'narrow' })}</div>`).join('')}${days.map(d => dayCell(d, true)).join('')}</div>`;
}
function monthGridHTML(offset = 0) {
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const lead = (first.getDay() + 6) % 7, n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const heads = [...Array(7)].map((_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(LOC(), { weekday: 'narrow' }));
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="blank"></span>';
  for (let d = 1; d <= n; d++) cells += dayCell(new Date(first.getFullYear(), first.getMonth(), d), false);
  return `<div class="cal month">${heads.map(h => `<div class="wd">${h}</div>`).join('')}${cells}</div>`;
}
function periodCounts(from, to) {
  const c = { lower: 0, upper: 0, yoga: 0, tennis: 0, rest: 0 };
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const st = dayStatus(dayKey(d));
    if (st === 'both') { c.lower++; c.upper++; } else if (st) c[st]++;
  }
  return c;
}
let calMode = 'week', calOffset = 0;
function calendarCardHTML() {
  let title, from, to;
  if (calMode === 'week') {
    from = weekStart(calOffset); to = new Date(from.getFullYear(), from.getMonth(), from.getDate() + 6);
    title = calOffset === 0 ? 'This week' : calOffset === -1 ? 'Last week' : `${from.toLocaleDateString(LOC(), { day: 'numeric', month: 'short' })} to ${to.toLocaleDateString(LOC(), { day: 'numeric', month: 'short' })}`;
  } else {
    const now = new Date(); from = new Date(now.getFullYear(), now.getMonth() + calOffset, 1); to = new Date(from.getFullYear(), from.getMonth() + 1, 0);
    title = from.toLocaleDateString(LOC(), { month: 'long', year: 'numeric' });
  }
  const c = periodCounts(from, to > new Date() ? new Date() : to);
  const summary = [c.lower + c.upper ? `${c.lower + c.upper} workout${c.lower + c.upper === 1 ? '' : 's'}` : 'No workouts yet', c.yoga ? `${c.yoga} yoga` : '', c.tennis ? `${c.tennis} tennis` : '', c.rest ? `${c.rest} rest` : ''].filter(Boolean).join(', ');
  return `<section class="card">

      <div style="text-align:center"><h3>${title}</h3><p class="small muted">${summary}</p></div>
      <button class="iconbtn" data-act="cal-next" aria-label="Next ${calMode}" ${calOffset >= 0 ? 'disabled style="opacity:.35"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    ${calMode === 'week' ? weekStripHTML(calOffset) : monthGridHTML(calOffset)}

    case 'day-edit': dayEditSheet(v); break;
    case 'day-set': setDay(v, b.dataset.t || null); autoBackup('day'); syncSoon(); closeSheet(); render(); break;
    case 'cal-mode': calMode = v; calOffset = 0; render(); break;
    case 'cal-prev': calOffset--; render(); break;
    case 'cal-next': if (calOffset < 0) calOffset++; render(); break;
    case 'close-sheet': closeSheet(); if (tab === 'today' && screen === 'home') render(); break;
    case 'cancel-ask': cancelSheet(); break;
    case 'cancel-yes': cancelWorkout(); break;
    case 'plan-sheet': planSheet(); break;
    case 'pref': { S.state.prefs = { ...prefs(), [v]: !prefs()[v] }; saveState(); render(); break; }
    case 'welcome-save': { const n = ($('#wel-name') || {}).value || '', ab = ($('#wel-about') || {}).value || ''; S.state.profile = { name: n.trim().slice(0, 40), about: ab.trim().slice(0, 400) }; S.state.welcomed = true; saveState(); closeSheet(); render(); break; }
    case 'welcome-skip': S.state.welcomed = true; saveState(); closeSheet(); render(); break;
    case 'note-tag': {
      A.notes = A.notes || {}; const n = A.notes[id] || (A.notes[id] = { text: '', tags: [] });
      n.tags = n.tags.includes(v) ? n.tags.filter(t => t !== v) : [...n.tags, v];
      b.setAttribute('aria-pressed', n.tags.includes(v)); saveActiveSoon(); noteSaved(id); break;
    }
    case 'warm': A.warmup = wview === 'focus' ? true : !A.warmup; rest = null; saveSession(A); renderWorkout(); window.scrollTo(0, 0); break;
    case 'w-': case 'w+': case 'r-': case 'r+': {
      const s = A.log[id][i], f = act[0], step = f === 'w' ? 1 : 1;
      const cur = parseFloat(s[f]) || 0;
      s[f] = f === 'w' ? nextWeight(cur, act[1] === '+' ? 1 : -1) : Math.max(0, +(cur + (act[1] === '+' ? step : -step)).toFixed(1));
      if (f === 'w') for (let k = i + 1; k < A.log[id].length; k++) if (!A.log[id][k].done) A.log[id][k].w = s.w;
      refreshCard(id); saveActiveSoon(); break;
    }
    case 'db': {
      const L = A.log[id], k = +v;
      L.forEach((x, j) => { if (b.dataset.all || j === i || (j > i && !x.done)) x.n = k; });
      refreshCard(id); saveActiveSoon(); break;
    }
    case 'check': {
      const it = A.items.find(x => x.id === id), s = A.log[id][i];
      if (hold && hold.id === id && hold.i === i) hold = null;
      s.done = !s.done; if (s.done) s.skipped = false; refreshCard(id); saveSession(A);
      if (s.done) { const c = document.querySelector(`#card-${id} .set:nth-child(${i + 1}) .check`); if (c) c.classList.add('pop'); afterSetDone(it, i); }
      break;
    }
    case 'hold': startHold(id, i); break;
    case 'how': { const prev = openDemo; openDemo = openDemo === id ? null : id; if (prev && prev !== id) refreshCard(prev); refreshCard(id); break; }
    case 'rest-add': if (rest && !rest.cue) { rest.end += 15000; rest.total += 15; tickRest(); } break;
    case 'rest-skip': stopRest(); break;
    case 'finish': closeSheet(); finishWorkout(); break;
    case 'to-today': screen = 'home'; tab = 'today'; summaryOf = null; render(); window.scrollTo(0, 0); break;
    case 'rest-skip-warm': stopRest(); break;
    case 'kegel-dot': { const key = dayKey(new Date()); S.state.kegels = S.state.kegels || {}; const cur = S.state.kegels[key] || 0; S.state.kegels[key] = (+v < cur) ? +v : +v + 1; saveState(); render(); break; }
    case 'kegel-start': kegelStart(); break;
    case 'kegel-pause': kg.paused = !kg.paused; drawKegel(); break;
    case 'kegel-stop': case 'kegel-close': kegelClose(); break;
    case 'del': delAsk = id; renderHistory(); break;
    case 'del-no': delAsk = null; renderHistory(); break;
    case 'del-yes': delAsk = null; deleteSession(id).then(renderHistory); renderHistory(); break;
    case 'export-xlsx': exportExcel(); break;
    case 'backup': backupJSON(); setTimeout(render, 300); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'restore-file' && e.target.files && e.target.files[0]) { restoreFrom(e.target.files[0]); e.target.value = ''; }
});
let noteTimer = null, profTimer = null;
function noteSaved(id) { const el = document.getElementById('note-saved-' + id); if (el) { el.textContent = 'Saved'; clearTimeout(noteSaved._t); noteSaved._t = setTimeout(() => { el.textContent = ''; }, 1500); } }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.note && A) {
    A.notes = A.notes || {}; const n = A.notes[t.dataset.note] || (A.notes[t.dataset.note] = { text: '', tags: [] });
    n.text = t.value.slice(0, 1000); clearTimeout(noteTimer); noteTimer = setTimeout(() => { saveSession(A); noteSaved(t.dataset.note); }, 600); return;
  }
  if (t.id === 'set-dumbbells') { S.state.prefs = { ...prefs(), dumbbells: t.value.slice(0, 60) }; clearTimeout(profTimer); profTimer = setTimeout(saveState, 600); return; }
  if (t.id === 'set-name' || t.id === 'set-about') {
    S.state.profile = { ...profile(), [t.id === 'set-name' ? 'name' : 'about']: t.value.slice(0, t.id === 'set-name' ? 40 : 400) };
    clearTimeout(profTimer); profTimer = setTimeout(() => { saveState(); const el = $('#set-saved'); if (el) { el.textContent = 'Saved'; setTimeout(() => { el.textContent = ''; }, 1500); } }, 600); return;
  }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.fold === 'notes') openNotes = d.open ? d.dataset.id : null; }, true);
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.f || !A) return;
  const s = A.log[el.dataset.id][+el.dataset.i];
  s[el.dataset.f] = el.value === '' ? '' : +el.value;
  if (el.dataset.f === 'w') {
    const list = A.log[el.dataset.id];
    for (let k = +el.dataset.i + 1; k < list.length; k++) if (!list[k].done) { list[k].w = s.w; const o = document.getElementById('w-' + el.dataset.id + '-' + k); if (o) o.value = s.w; }
  }
  saveActiveSoon();
});

applyLook();
render();
initStore();
</script>
